[package]
name = "gravitas-ui-wasm"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[lib]
crate-type = ["cdylib"]

[features]
# The headless suite's in-game cases: the scripted pointer, the restart
# button and screenshot requests.
headless-integration = []
# The visual scenario (verification: gravitas shots): the same cases, and
# the screenshots are taken.
e2e = ["headless-integration"]
fire-probe = ["e2e"]

[dependencies]
spring = { workspace = true }
spring-addons = { workspace = true }
springcabal = { workspace = true }
springcabal-control = { workspace = true }
gravitas-shared = { path = "../shared" }

[lints]
workspace = true
