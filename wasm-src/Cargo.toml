[workspace]
resolver = "2"
members = ["rules-synced", "shared", "ui"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
spring = { package = "spring-sdk", path = "../../../../../../spring-sdk-unified/rust/crates/spring-sdk" }
spring-addons = { path = "../../../../../../spring-sdk-unified/rust/crates/spring-addons" }
springcabal = { path = "../../../../springcabal-rs/crates/springcabal" }
springcabal-control = { path = "../../../../springcabal-rs/crates/springcabal-control" }
