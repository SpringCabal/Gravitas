[workspace]
resolver = "2"
members = ["rules-synced", "shared", "ui"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
spring = { git = "https://github.com/gajop/spring-rust", rev = "a0d7652ad9d8e84ace7ee0414118946a72f06d0d", features = ["alloc"] }
spring-addons = { git = "https://github.com/gajop/spring-rust", rev = "a0d7652ad9d8e84ace7ee0414118946a72f06d0d" }
springcabal = { git = "https://github.com/gajop/springcabal-rs", rev = "dcb1a9b3cd6cdbccbc101f1dc8fc89f527671bd4" }
springcabal-control = { git = "https://github.com/gajop/springcabal-rs", rev = "dcb1a9b3cd6cdbccbc101f1dc8fc89f527671bd4" }
